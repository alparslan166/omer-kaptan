<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GitHub API Test</title>
</head>
<body>
  <h1>GitHub API Modül Test</h1>
  <button onclick="testModules()">Modülleri Test Et</button>
  <div id="result"></div>
  
  <script src="github-api-config.js"></script>
  <script src="github-api.js"></script>
  <script>
    function testModules() {
      const result = document.getElementById('result');
      let html = '<h2>Test Sonuçları:</h2><ul>';
      
      // GitHubConfig test
      if (window.GitHubConfig) {
        html += '<li>✅ GitHubConfig yüklendi</li>';
        html += `<li>Config: ${JSON.stringify(window.GitHubConfig.getConfig())}</li>`;
      } else {
        html += '<li>❌ GitHubConfig yüklenmedi</li>';
      }
      
      // GitHubAPI test
      if (window.GitHubAPI) {
        html += '<li>✅ GitHubAPI yüklendi</li>';
        html += `<li>Fonksiyonlar: ${Object.keys(window.GitHubAPI).join(', ')}</li>`;
      } else {
        html += '<li>❌ GitHubAPI yüklenmedi</li>';
      }
      
      html += '</ul>';
      result.innerHTML = html;
    }
    
    // Sayfa yüklendiğinde test et
    window.addEventListener('load', () => {
      setTimeout(() => {
        testModules();
      }, 500);
    });
  </script>
</body>
</html>
